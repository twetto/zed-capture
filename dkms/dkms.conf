# zed-capture's uvcvideo: the kernel's own, with 32 transfers queued for a stream instead of 5
# (prepare.sh downloads the kernel's source, checks it and makes the change). See README.md.
PACKAGE_NAME="uvcvideo-zed"
PACKAGE_VERSION="1"
PRE_BUILD="prepare.sh ${kernelver} 32"
BUILT_MODULE_NAME[0]="uvcvideo"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
