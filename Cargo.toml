[workspace]
members = [".", "crates/zed-capture-python"]
# Builds only with a ROS 2 environment sourced (r2r): its own lock file and target
exclude = ["crates/zed-capture-ros"]

[package]
name = "zed-capture"
version = "0.1.0"
edition = "2024"
# The GStreamer bindings' (feature nvjpg); also what cargo resolves dependencies for
rust-version = "1.92"
description = "Stereolabs ZED 2 / 2i / Mini on Linux without the ZED SDK: V4L2 video into a frame ring, every IMU sample from hidraw"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
# zed_record's: MCAP without zstd/lz4 (JPEG does not compress), JPEG in pure Rust
mcap = { version = "0.26", default-features = false, optional = true }
jpeg-encoder = { version = "0.7", optional = true }
# The Jetson's JPEG encoder through GStreamer (zed_capture::nvjpg; zed_record --encoding nvjpg,
# zed_ros's JPEG topics): build on the Jetson
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }

[features]
record = ["dep:mcap", "dep:jpeg-encoder"]
# zed_capture::nvjpg alone
nvjpg-encoder = ["dep:gstreamer", "dep:gstreamer-app"]
nvjpg = ["record", "nvjpg-encoder"]

[[bin]]
name = "zed_record"
required-features = ["record"]

[profile.release]
debug = "line-tables-only"
