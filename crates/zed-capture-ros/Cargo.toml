[package]
name = "zed-capture-ros"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "zed_ros: a ZED's frames and IMU as ROS 2 topics, from zed-capture (no ZED SDK)"

[[bin]]
name = "zed_ros"
path = "src/main.rs"

[dependencies]
zed-capture = { path = "../.." }
libc = "0.2"
r2r = "0.9.7"

[profile.release]
debug = "line-tables-only"

# Not in the zed-capture workspace: it builds only with ROS 2 sourced
[workspace]
