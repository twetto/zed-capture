[package]
name = "zed-capture-ros"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "zed_ros: a ZED's frames and IMU as ROS 2 topics, from zed-capture (no ZED SDK)"

[[bin]]
name = "zed_ros"
path = "src/main.rs"

[features]
# The JPEG topics (<image>/nvjpg) on the Jetson's hardware encoder, through GStreamer: building
# needs its development files (libgstreamer1.0-dev, libgstreamer-plugins-base1.0-dev); elsewhere
# --no-default-features
default = ["nvjpg", "gpu"]
nvjpg = ["zed-capture/nvjpg-encoder"]
# Rectification on the GPU (Rudolf-V's, through wgpu and Vulkan); without it, or without a GPU at
# run time, on the CPU
gpu = ["rudolf-v/gpu"]

[dependencies]
zed-capture = { path = "../.." }
libc = "0.2"
r2r = "0.9.7"
# Rectification: its maps, and on the GPU its GpuRectification (feature gpu)
rudolf-v = { git = "https://github.com/twetto/Rudolf-V", rev = "410c678d97ae5db9129e759315632b51eb7b71b3", default-features = false }

[profile.release]
debug = "line-tables-only"

# Not in the zed-capture workspace: it builds only with ROS 2 sourced
[workspace]
